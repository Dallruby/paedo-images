<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그놈들은 오늘도 멋있었다</title>
<style>
/* ===================================================================
   그놈들은 오늘도 멋있었다 · 미니홈피
   2004 / 단월사립고등학교
   =================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#2b353d;
  font-family:Gulim,"굴림",Dotum,"돋움","Malgun Gothic","맑은 고딕",AppleGothic,sans-serif;
  font-size:12px;line-height:1.55;color:#4a4a4a;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid #d93a3a;outline-offset:1px}
img{display:block;max-width:100%}
input{font:inherit}

#phone{position:relative;overflow:hidden;background:#e4eef5;width:100%;height:100dvh}
@media (min-width:760px){
  body{display:flex;align-items:center;justify-content:center;
       background:radial-gradient(ellipse at 50% -10%,#55666f 0%,#232c33 72%)}
  #phone{width:392px;height:min(834px,calc(100vh - 40px));
    border:11px solid #0d1114;border-radius:38px;
    box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px #333c43,inset 0 0 0 1px #000}
}
#screen{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:33px 0 10px}

/* ---------- 상단 바 ---------- */
.gnb{position:absolute;top:0;left:0;right:0;z-index:90;height:33px;
  display:flex;align-items:center;gap:3px;padding:0 9px;
  background:linear-gradient(#6ba3d0,#3d76ac);
  border-bottom:1px solid #2c5b8a;box-shadow:0 1px 3px rgba(0,0,0,.16)}
.gnb .bi{font-size:12px;font-weight:bold;color:#fff;letter-spacing:-1px;
  margin-right:auto;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.gnb button{font-size:10px;color:#e9f4fc;letter-spacing:-.5px;padding:4px 9px;
  border:1px solid rgba(255,255,255,.32);border-radius:3px;
  background:rgba(255,255,255,.12);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.gnb button:hover{background:rgba(255,255,255,.26)}
.gnb .surf{background:rgba(255,255,255,.24);font-weight:bold}

/* ===================================================================
   인트로
   =================================================================== */
#intro{position:absolute;inset:0;z-index:300;overflow:hidden;
  background:linear-gradient(168deg,#fff 0%,#f4f7ff 34%,#e4ecff 70%,#d4e0ff 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 26px}
#intro.gone{display:none}
#intro.out{animation:introOut .6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.07);filter:blur(4px)}}

#intro .orb{position:absolute;border-radius:50%;filter:blur(54px);pointer-events:none}
#intro .o1{width:300px;height:300px;top:-95px;left:-105px;
  background:radial-gradient(circle,rgba(110,155,255,.55) 0%,rgba(110,155,255,0) 70%)}
#intro .o2{width:350px;height:350px;bottom:-140px;right:-125px;
  background:radial-gradient(circle,rgba(150,190,255,.5) 0%,rgba(150,190,255,0) 70%)}
#intro .o3{width:220px;height:220px;top:24%;right:-85px;
  background:radial-gradient(circle,rgba(200,222,255,.62) 0%,rgba(200,222,255,0) 70%)}
#intro .dots{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle,#c2d3ff 1px,transparent 1px);
  background-size:23px 23px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 46%,transparent 24%,#000 84%);
  mask-image:radial-gradient(ellipse at 50% 46%,transparent 24%,#000 84%)}
#intro > *{position:relative;z-index:2}

.spark{position:absolute;z-index:1;color:#8fb2f5;pointer-events:none;opacity:0;
  font-size:13px;text-shadow:0 0 12px rgba(110,155,255,.7)}
.s1{top:21%;left:11%}
.s2{top:15%;right:14%;font-size:9px}
.s3{bottom:30%;left:18%;font-size:10px}
.s4{bottom:24%;right:11%;font-size:16px}
.s5{top:41%;left:6%;font-size:8px}

.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 15px;border-radius:999px;
  border:1.5px solid #244cca;background:rgba(255,255,255,.75);
  font-size:10px;letter-spacing:1.2px;color:#244cca;font-weight:bold}
.badge i{width:5px;height:5px;border-radius:50%;background:#244cca;font-style:normal}

.logo-wrap{width:min(304px,86%);margin:28px 0 2px}
.logo{width:100%;filter:drop-shadow(0 9px 26px rgba(36,76,202,.22))}

.i-en{margin-top:14px;font-family:Verdana,Geneva,sans-serif;font-size:8.5px;
  letter-spacing:4.5px;color:#8296cf;text-transform:uppercase}
.i-sub{margin-top:21px;font-size:11px;color:#6c80b6;line-height:1.95;letter-spacing:.4px}
.i-sub b{color:#244cca;font-weight:bold}

.i-btn{margin-top:29px;padding:13px 34px;border-radius:999px;border:0;
  background:linear-gradient(160deg,#3e68e4,#244cca 58%,#1b3cab);
  color:#fff;font-size:13px;font-weight:bold;letter-spacing:1px;text-align:center;
  box-shadow:0 8px 24px rgba(36,76,202,.34),inset 0 1px 0 rgba(255,255,255,.3)}
.i-btn:hover{box-shadow:0 12px 32px rgba(36,76,202,.44)}
.i-btn:active{transform:translateY(1px)}
.boot{margin-top:17px;font-family:Verdana,Geneva,sans-serif;font-size:8.5px;
  letter-spacing:2.5px;color:#a5b7e6;min-height:13px}

@media (prefers-reduced-motion:no-preference){
  .badge{animation:rise .72s .04s cubic-bezier(.22,1,.36,1) both}
  .logo-wrap{animation:pop 1.05s .16s cubic-bezier(.22,1,.36,1) both}
  .logo{animation:float 5.5s 1.2s ease-in-out infinite}
  .i-en{animation:rise .72s .46s cubic-bezier(.22,1,.36,1) both}
  .i-sub{animation:rise .72s .58s cubic-bezier(.22,1,.36,1) both}
  .i-btn{animation:rise .72s .7s cubic-bezier(.22,1,.36,1) both}
  .boot{animation:rise .72s .84s cubic-bezier(.22,1,.36,1) both}
  .spark{animation:tw 3.6s ease-in-out infinite}
  .s1{animation-delay:1.3s}.s2{animation-delay:2.2s}.s3{animation-delay:3.1s}
  .s4{animation-delay:1.8s}.s5{animation-delay:2.7s}
  @keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:translateY(22px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.5) rotate(0)}
                46%{opacity:.95;transform:scale(1.2) rotate(40deg)}}
}

/* ---------- 파도타기 전환 ---------- */
.wash{position:absolute;inset:0;z-index:250;pointer-events:none;
  transform:translateY(102%);visibility:hidden;will-change:transform}
.wash .sea{position:absolute;left:0;right:0;top:30px;bottom:0;
  background:linear-gradient(180deg,#63a0dd 0%,#3b76bf 42%,#26569b 100%)}
.wash .wv{position:absolute;left:0;width:200%;height:46px}
.wash .w1{top:0}
.wash .w1 path{fill:#63a0dd}
.wash .w2{top:13px;opacity:.5}
.wash .w2 path{fill:#a5d2f2}
.wash .w3{top:23px;opacity:.28}
.wash .w3 path{fill:#e2f1ff}
.wash .foam{position:absolute;left:0;right:0;top:30px;bottom:0;overflow:hidden}
.wash .foam i{position:absolute;bottom:-14px;border-radius:50%;
  background:rgba(255,255,255,.55);opacity:0}
.wash .lb{position:absolute;left:0;right:0;top:49%;text-align:center;opacity:0;
  font-size:12px;color:#fff;letter-spacing:6px;text-shadow:0 2px 12px rgba(0,25,60,.45)}
.wash .lb small{display:block;margin-top:7px;font-size:9px;letter-spacing:2px;
  color:rgba(255,255,255,.72)}
.wash.on{visibility:visible;animation:wash 1.45s cubic-bezier(.62,0,.24,1) forwards}
@keyframes wash{
  0%{transform:translateY(102%)}30%{transform:translateY(0)}
  64%{transform:translateY(0)}100%{transform:translateY(-102%)}
}
@media (prefers-reduced-motion:no-preference){
  .wash.on .lb{animation:lbf 1.45s ease-in-out forwards}
  .wash.on .w1{animation:drift 2.3s linear infinite}
  .wash.on .w2{animation:drift 1.5s linear infinite reverse}
  .wash.on .w3{animation:drift 3.2s linear infinite}
  .wash.on .foam i{animation:bub 1.45s ease-out forwards}
  @keyframes drift{to{transform:translateX(-50%)}}
  @keyframes lbf{0%,16%{opacity:0}32%,58%{opacity:1}78%,100%{opacity:0}}
  @keyframes bub{0%{transform:translateY(0) scale(.35);opacity:0}
                 22%{opacity:.8}100%{transform:translateY(-320px) scale(1);opacity:0}}
  #screen.dip{animation:dip 1.45s ease-in-out}
  @keyframes dip{0%,100%{transform:none}42%,58%{transform:scale(.984)}}
}
@media (prefers-reduced-motion:reduce){.wash.on{animation-duration:.4s}}

/* ---------- 페이지 전환 ---------- */
@media (prefers-reduced-motion:no-preference){
  .pgin{animation:pgin .34s cubic-bezier(.22,1,.36,1)}
  @keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

/* ---------- 종이 ---------- */
.binder{padding:9px 8px 12px}
.sheet{display:flex;align-items:flex-start;position:relative;padding:6px;
  background-color:var(--paper,#fff);background-image:var(--pat,none);
  background-size:var(--patsz,auto);
  border:1px solid var(--edge,#a8c8df);border-radius:7px;
  box-shadow:0 1px 4px rgba(40,70,95,.13);min-height:calc(100dvh - 96px)}
.sheet:before{content:"";position:absolute;inset:4px;border-radius:4px;
  border:1px dotted var(--line,#cfe0ee);pointer-events:none}
.rings{position:absolute;left:8px;top:30px;bottom:30px;width:10px;z-index:3;
  display:flex;flex-direction:column;justify-content:space-between}
.ring{width:10px;height:7px;border-radius:5px/4px;border:1px solid var(--ring,#8fb4d0);
  background:linear-gradient(var(--ringf,#eaf3fa),var(--ring,#8fb4d0))}
.page{flex:1;min-width:0;padding:10px 3px 16px 21px;position:relative;z-index:1}

/* ---------- 인덱스 탭 ---------- */
.tabs{flex:none;width:41px;position:sticky;top:41px;align-self:flex-start;
  z-index:4;display:flex;flex-direction:column;gap:3px;margin:5px -2px 0 -3px}
.tab{display:block;width:41px;padding:6px 0 5px;font-size:9px;letter-spacing:-1px;
  text-align:center;color:var(--tabtx,#3a6f97);
  border:1px solid var(--edge,#a8c8df);border-right:none;border-radius:4px 0 0 4px;
  background:linear-gradient(180deg,var(--card,#fff) 0%,var(--tabbg,#dbebf6) 48%,var(--tabbg,#dbebf6) 100%)}
.tab.on{width:46px;margin-left:-5px;font-weight:bold;color:#fff;
  border-color:var(--accent,#3e7bb0);
  background:linear-gradient(180deg,var(--accent2,#6fa5cf),var(--accent,#3e7bb0))}

/* ---------- 머리 ---------- */
.hd{padding-bottom:9px;border-bottom:1px solid var(--line,#cfe0ee)}
.cnt{display:block;font-family:Verdana,Geneva,sans-serif;font-size:9px;
  color:var(--dim,#8ba1b1);white-space:nowrap}
.cnt b{color:#d64545;font-weight:normal}
.hd-t{font-size:18px;font-weight:bold;letter-spacing:-1.6px;color:var(--accent,#3e7bb0);
  padding-top:8px;line-height:1.25;text-align:center}

/* ---------- BGM ---------- */
.bgm{display:flex;align-items:center;gap:7px;margin-top:9px;padding:5px 7px;
  border:1px solid var(--line,#cfe0ee);border-radius:3px;
  background:linear-gradient(180deg,var(--card,#fff),var(--soft,#f0f7fc))}
.bgm .cv{flex:none;width:19px;height:19px;border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;
  background:linear-gradient(140deg,var(--accent2,#6fa5cf),var(--accent,#3e7bb0))}
.bgm .lb{flex:none;font-family:Verdana,Geneva,sans-serif;font-size:8px;
  color:var(--dim,#9db0bd);letter-spacing:.5px}
.bgm .tt{flex:1;min-width:0;font-size:10.5px;color:var(--txt,#5b6f7c);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bgm .bt{flex:none;width:21px;height:17px;border-radius:2px;text-align:center;line-height:15px;
  font-size:9px;color:var(--accent,#3e7bb0);border:1px solid var(--line,#cfe0ee);
  background:linear-gradient(var(--card,#fff),var(--soft,#f0f7fc))}
.eq{flex:none;display:flex;align-items:flex-end;gap:1.5px;height:11px}
.eq i{width:2px;height:3px;display:block;border-radius:1px;background:var(--accent2,#6fa5cf)}
@media (prefers-reduced-motion:no-preference){
  .eq.play i{animation:eqb .78s ease-in-out infinite}
  .eq.play i:nth-child(2){animation-delay:.2s}
  .eq.play i:nth-child(3){animation-delay:.4s}
  @keyframes eqb{0%,100%{height:3px}50%{height:11px}}
}

/* ---------- 구역 제목 ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin:17px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line,#cfe0ee)}
.sec h3{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:bold;
  color:var(--accent,#3e7bb0);letter-spacing:-.5px}
.sec h3:before{content:"";width:3px;height:10px;border-radius:1px;
  background:linear-gradient(var(--accent2,#6fa5cf),var(--accent,#3e7bb0))}
.sec em{font-style:normal;font-family:Verdana,Geneva,sans-serif;font-size:9px;color:var(--dim,#9db0bd)}

/* ---------- 슬롯 ---------- */
.slot{background:linear-gradient(160deg,var(--soft,#f0f7fc),var(--card,#fff));
  border:1px solid var(--line,#cfe0ee);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--dim,#9db0bd);font-size:9px;text-align:center;padding:8px;
  font-family:Verdana,Geneva,sans-serif;letter-spacing:.5px}
.slot .fn{font-size:8px;word-break:break-all;line-height:1.4;opacity:.62}
.s-room{width:100%;aspect-ratio:4/3}
.s-photo{width:100%;aspect-ratio:4/3;border-radius:2px}

/* ---------- 일촌평 ---------- */
.ic2{padding:7px 2px;border-bottom:1px dotted var(--line,#d8e6f0)}
.ic2:last-of-type{border-bottom:none}
.ic2 .l1{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.ic2 .who{font-size:11px;font-weight:bold;color:var(--accent,#3e7bb0)}
.ic2 .nk{font-size:9px;color:var(--dim,#9db0bd)}
.ic2 .tx{font-size:11.5px;color:var(--txt,#5b6f7c);padding-top:2px}
.jump{color:var(--accent,#3e7bb0);text-decoration:underline;padding:0;font-weight:bold}
.tally{margin-top:13px;padding:7px 8px;border-radius:3px;
  background:var(--soft,#f0f7fc);border:1px solid var(--line,#cfe0ee);
  font-size:9.5px;color:var(--dim,#8ba1b1);letter-spacing:-.3px;text-align:center}
.tally b{color:var(--txt,#5b6f7c);font-weight:normal}
.skinname{margin-top:7px;font-size:9px;color:var(--dim,#a5b8c4);letter-spacing:-.3px;text-align:right}

/* ---------- 다이어리 ---------- */
.d{border-bottom:1px dotted var(--line,#d8e6f0)}
.d-h{display:flex;width:100%;gap:7px;align-items:baseline;padding:8px 2px}
.d-dt{flex:none;font-family:Verdana,Geneva,sans-serif;font-size:9px;color:var(--dim,#a5b8c4)}
.d-t{flex:1;font-size:11.5px;color:var(--txt,#4d626f);letter-spacing:-.3px}
.d-p{flex:none;font-size:8.5px;color:#fff;border-radius:2px;padding:1px 5px;
  background:linear-gradient(var(--accent2,#6fa5cf),var(--accent,#3e7bb0))}
.d-l{color:var(--dim,#a5b8c4)}
.d-x{color:var(--dim,#bfcbd4);text-decoration:line-through}
.d-b{display:none;padding:3px 4px 17px;font-size:11.5px;color:var(--txt,#5b6f7c);
  white-space:pre-line;line-height:2.05}
.d.open .d-b{display:block}
.d-lock{display:none;margin:0 0 13px;padding:13px;text-align:center;font-size:10.5px;
  color:var(--dim,#9db0bd);border-radius:3px;
  background:var(--soft,#f6fafd);border:1px solid var(--line,#d8e6f0)}
.d.open .d-lock{display:block}
.d-pw{display:none;margin:0 0 13px;padding:12px 11px;border-radius:3px;
  background:var(--soft,#f6fafd);border:1px solid var(--line,#d8e6f0)}
.d.open .d-pw{display:block}
.d-pw .hint{font-size:10px;color:var(--dim,#9db0bd);margin-bottom:8px}
.d-pw .row{display:flex;gap:5px}
.d-pw input{flex:1;min-width:0;border:1px solid var(--line,#cfe0ee);border-radius:2px;
  background:var(--card,#fff);padding:5px 7px;font-size:11px;color:var(--txt,#4a4a4a)}
.d-pw .ok{flex:none;border-radius:2px;color:#fff;font-size:10px;padding:5px 13px;
  text-align:center;border:1px solid var(--accent,#3e7bb0);
  background:linear-gradient(var(--accent2,#6fa5cf),var(--accent,#3e7bb0))}
.d-pw .msg{font-size:10px;color:#d96060;min-height:14px;padding-top:6px}

/* ---------- 사진첩 ---------- */
.pi{border:1px solid var(--line,#cfe0ee);border-radius:3px;background:var(--card,#fff);
  padding:6px;margin-bottom:12px;box-shadow:0 1px 2px rgba(60,90,115,.07)}
.pc{font-size:11px;color:var(--txt,#5b6f7c);padding:7px 2px 0;letter-spacing:-.3px}
.pd{font-family:Verdana,Geneva,sans-serif;font-size:8px;color:var(--dim,#adc0cc);padding:1px 2px 5px}
.pcm{display:block;width:100%;border-top:1px dotted var(--line,#e0ebf3);
  padding:6px 2px 2px;font-size:10px;color:var(--accent,#3e7bb0)}
.pcl{display:none;padding:4px 2px 2px}
.pi.open .pcl{display:block}
.pcl div{font-size:10.5px;color:var(--txt,#6b7f8c);padding:4px 0;
  border-top:1px dotted var(--line,#e9f0f5);line-height:1.6}
.pcl div:first-child{border-top:none}
.pcl b{color:var(--accent,#3e7bb0);font-weight:bold;margin-right:5px}
.pcl .more{color:var(--dim,#a9bbc6);text-align:center;font-size:9.5px}

/* ---------- 방명록 ---------- */
.gb{border:1px solid var(--line,#cfe0ee);border-radius:3px;margin-bottom:8px;
  background:var(--card,#fff);overflow:hidden;box-shadow:0 1px 2px rgba(60,90,115,.06)}
.gb-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  padding:5px 7px;border-bottom:1px solid var(--line,#e0ebf3);
  background:linear-gradient(180deg,var(--card,#fff),var(--soft,#f0f7fc))}
.gb-n{font-family:Verdana,Geneva,sans-serif;font-size:9px;color:var(--dim,#adc0cc);margin-right:5px}
.gb-w{font-size:11px;font-weight:bold;color:var(--accent,#3e7bb0)}
.gb-d{font-family:Verdana,Geneva,sans-serif;font-size:8.5px;color:var(--dim,#adc0cc);white-space:nowrap}
.gb-b{padding:8px 7px;font-size:11.5px;color:var(--txt,#5b6f7c);white-space:pre-line;line-height:1.9}
.gb-b.sc{color:var(--dim,#a9bbc6);text-align:center}
.gb-r{border-top:1px dotted var(--line,#e0ebf3);padding:6px 7px 6px 15px;
  font-size:11px;color:var(--dim,#7d919d);background:var(--soft,#f6fafd)}
.none{font-size:11px;color:var(--dim,#a9bbc6);padding:14px 2px;text-align:center}
</style>
</head>
<body>

<div id="phone">
  <nav class="gnb">
    <span class="bi">사이월드</span>
    <button type="button" data-go="user">내 미니홈피</button>
    <button type="button" class="surf" id="surf">파도타기</button>
  </nav>

  <div id="screen">
    <div class="binder">
      <div class="sheet">
        <div class="rings"><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i></div>
        <div class="page" id="page"></div>
        <nav class="tabs" id="tabs"></nav>
      </div>
    </div>
  </div>

  <div class="wash" id="wash">

function slot(cls,src,label){
  return `<div class="slot ${cls}">${esc(label)}<span class="fn">${esc(src||"")}</span></div>
  <img src="${esc(src)}" alt="" class="${cls}" style="display:none"
    onload="this.style.display='block';this.previousElementSibling.remove()"
    onerror="this.remove()">`;
}

function bgmBar(c){
  const playing = unlocked && !audio.paused && !noAudio;
  return `<div class="bgm">
    <span class="cv">♪</span><span class="lb">BGM</span>
    <span class="eq ${playing?"play":""}"><i></i><i></i><i></i></span>
    <span class="tt">${esc(c.bgm.title)}${noAudio?" (음원 없음)":""}</span>
    <button class="bt" data-bgm="1" title="재생 / 정지">${playing?"■":"▶"}</button>
  </div>`;
}

      const w=g.sc?`<span class="gb-w">비밀</span>`
        :`<span class="gb-w">${g.go?`<button class="jump" data-go="${g.go}">${esc(g.who)}</button>`:esc(g.who)}</span>`;
      const b=g.sc?`<div class="gb-b sc">🔒 비밀글입니다</div>`
                  :`<div class="gb-b">${esc(g.body)}</div>`;
      return `<div class="gb"><div class="gb-h">
        <span><span class="gb-n">[${no}]</span>${w}</span>
        <span class="gb-d">${esc(g.dt)}</span></div>
        ${b}${g.re?`<div class="gb-r">${esc(g.re)}</div>`:""}</div>`;
    }).join("");
}

function render(){
  const c=DATA[who], s=c.skin, h=HIT[who];
  document.querySelector(".sheet").style.cssText =
    `--paper:${s.paper};--pat:${s.pat};--patsz:${s.patsz};--card:${s.card};--edge:${s.edge};`+
    `--accent:${s.accent};--accent2:${s.accent2};--line:${s.line};--soft:${s.soft};`+
    `--ring:${s.ring};--ringf:${s.ringf};--dim:${s.dim};--txt:${s.txt}`;
  $("#tabs").style.cssText=
    `--tabbg:${s.tabbg};--tabtx:${s.tabtx};--card:${s.card};--accent:${s.accent};--accent2:${s.accent2};--edge:${s.edge}`;

  const body = tab==="home"?viewHome(c) : tab==="diary"?viewDiary(c)
             : tab==="photo"?viewPhoto(c) : viewGuest(c);

  $("#page").innerHTML=`
    <div class="pgin">
    <div class="hd">
      <span class="cnt">TODAY <b>${nf(h.t)}</b> | TOTAL <b>${nf(h.n)}</b></span>
      <h2 class="hd-t">${esc(c.title)}</h2></div>
    ${bgmBar(c)}
    ${body}</div>`;

  $("#tabs").innerHTML=TABS.map(([k,l])=>
    `<button class="tab ${k===tab?"on":""}" data-tab="${k}">${l}</button>`).join("");

  $("#screen").scrollTop=0;
}

function go(k){
  if(k!==who && !DATA[k].mine){ HIT[k].t++; HIT[k].n++; }
  who=k; tab="home"; playBgm(); render();
}

function surf(){
  if(washing) return;
  washing=true;
  const rest=ORDER.filter(k=>k!==who);
  const next=rest[Math.floor(Math.random()*rest.length)];
  const ov=$("#wash"), sc=$("#screen");
  ov.classList.remove("on"); sc.classList.remove("dip");
  void ov.offsetWidth; void sc.offsetWidth;
  ov.classList.add("on"); sc.classList.add("dip");
  setTimeout(()=>go(next), 620);
  setTimeout(()=>{ ov.classList.remove("on"); sc.classList.remove("dip"); washing=false; }, 1480);
}

function playBgm(){
  const c=DATA[who];
  if(!unlocked) return;
  if(audio.src && audio.src.endsWith(c.bgm.file)) return;
  noAudio=false;
  audio.src=c.bgm.file;
  audio.play().then(()=>render()).catch(()=>{ noAudio=true; render(); });
}

function tryPw(i){
  const d=DATA[who].diary[i];
  const inp=document.querySelector(`[data-in="${i}"]`);
  const msg=document.querySelector(`[data-msg="${i}"]`);
  if(!inp) return;
  if(inp.value.trim()===d.pw){ OPEN.add(who+":"+i); render(); }
  else { msg.textContent="비밀번호가 틀렸습니다"; inp.value=""; inp.focus(); }
}

document.addEventListener("click", e=>{
  if(e.target.closest("#surf")){ surf(); return; }
  if(e.target.closest("[data-bgm]")){
    if(audio.paused){ audio.play().then(()=>render()).catch(()=>{noAudio=true;render();}); }
    else { audio.pause(); render(); }
    return;
  }
  const ok=e.target.closest("[data-ok]");
  if(ok){ tryPw(+ok.dataset.ok); return; }
  const g=e.target.closest("[data-go]");
  if(g){ go(g.dataset.go); return; }
  const t=e.target.closest("[data-tab]");
  if(t){ tab=t.dataset.tab; render(); return; }
  const p=e.target.closest("[data-p]");
  if(p){ p.parentElement.classList.toggle("open"); return; }
  const d=e.target.closest("[data-d]");
  if(d) d.parentElement.classList.toggle("open");
});

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.in!==undefined)
    tryPw(+e.target.dataset.in);
});

const BOOT=["CONNECTING","CONNECTING .","CONNECTING . .","CONNECTING . . ."];
const intro=$("#intro");
let bi=0;
setInterval(()=>{ $("#boot").textContent=BOOT[bi++%BOOT.length]; },420);

$("#enter").addEventListener("click",()=>{
  if(unlocked) return;
  unlocked=true;
  intro.classList.add("out");
  playBgm(); render();
  setTimeout(()=>intro.classList.add("gone"), 620);
});

render();
</script>
</body>
</html>
